<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Sing That Song</title>
<style>
  :root{
    --t1:#d62828;          /* team 1 */
    --t1-dark:#7a0e0e;
    --t2:#1d4ed8;          /* team 2 */
    --t2-dark:#0b2a7a;
    --ok:#16a34a;
    --warn:#f59e0b;
    --bad:#b91c1c;
    --ink:#fff;
    --panel:rgba(0,0,0,.28);
    --panel2:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:#111;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
    transition:background .35s ease;
  }
  body.team1{background:linear-gradient(160deg,var(--t1),var(--t1-dark));}
  body.team2{background:linear-gradient(160deg,var(--t2),var(--t2-dark));}
  body.timeup{animation:flash .5s ease-in-out 3;}
  @keyframes flash{0%,100%{filter:none;}50%{filter:brightness(1.6) saturate(1.4);}}

  #app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}

  /* Scoreboard */
  .score{display:flex;gap:8px;padding:10px 10px 4px;}
  .score .card{
    flex:1;background:var(--panel);border-radius:14px;padding:8px 10px;text-align:center;
    border:2px solid transparent;transition:border .2s,opacity .2s;opacity:.62;
  }
  .score .card.active{border-color:rgba(255,255,255,.9);opacity:1;box-shadow:0 4px 18px rgba(0,0,0,.25);}
  .score .name{font-size:14px;font-weight:600;letter-spacing:.3px;opacity:.9;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .score .pts{font-size:34px;font-weight:800;line-height:1;margin-top:2px;}
  .score .turn{font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.0;height:12px;}
  .score .card.active .turn{opacity:.85;}

  .topbar{display:flex;justify-content:space-between;align-items:center;padding:0 14px;}
  .topbar .label{font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.7;font-weight:700;}
  .iconbtn{background:var(--panel);border:none;color:var(--ink);border-radius:10px;
    padding:8px 10px;font-size:18px;line-height:1;}
  /* small, low-key "give up" — easy to ignore, hard to hit by accident */
  .giveup{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;
    border-radius:8px;padding:3px 7px;font-size:10px;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;opacity:.45;}
  .giveup:active{opacity:.9;}

  /* Stage */
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:6px 16px;text-align:center;min-height:0;}
  .turnlabel{font-size:13px;text-transform:uppercase;letter-spacing:3px;font-weight:700;opacity:.85;margin-bottom:4px;}
  .word{font-size:clamp(40px,13vw,86px);font-weight:900;line-height:1.02;text-transform:lowercase;
    word-break:break-word;text-shadow:0 3px 16px rgba(0,0,0,.35);}
  .passes{font-size:13px;opacity:.8;margin-top:10px;letter-spacing:.5px;}
  .passes b{font-size:16px;}

  /* Timer */
  .timerwrap{margin:8px 0 2px;display:flex;flex-direction:column;align-items:center;}
  .timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:clamp(54px,18vw,120px);line-height:1;}
  .timer.low{color:#ffe08a;}
  .timer.crit{color:#fff;animation:pulse .6s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.45;}}
  .bar{width:min(520px,86vw);height:8px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;margin-top:6px;}
  .bar>i{display:block;height:100%;width:100%;background:#fff;border-radius:99px;transition:width .12s linear;}
  .statusmsg{margin-top:6px;font-size:18px;font-weight:800;letter-spacing:1px;height:22px;}
  .statusmsg.bad{color:#ffd9d9;}

  /* Controls */
  .controls{padding:8px 12px 14px;display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;gap:10px;}
  button.btn{
    flex:1;border:none;border-radius:16px;color:#fff;font-weight:800;
    padding:18px 10px;font-size:18px;letter-spacing:.3px;
    background:var(--panel2);backdrop-filter:blur(2px);
    transition:transform .05s, filter .15s;
  }
  button.btn:active{transform:scale(.97);}
  button.btn.big{padding:26px 10px;font-size:24px;}
  button.btn.go{background:#fff;color:#111;}
  button.btn.ok{background:var(--ok);}
  button.btn.warn{background:var(--warn);color:#3a2a00;}
  button.btn.bad{background:var(--bad);}
  button.btn:disabled{opacity:.35;}
  .hide{display:none !important;}

  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;
    justify-content:center;z-index:20;}
  .sheet{background:#1b1b1f;width:100%;max-width:560px;border-radius:20px 20px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;}
  .sheet h2{margin:.2em 0 .6em;font-size:20px;}
  .sheet h3{margin:1.1em 0 .4em;font-size:13px;text-transform:uppercase;letter-spacing:1.5px;opacity:.6;}
  .field{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;}
  .field label{font-size:15px;}
  .field input[type=text]{background:#2a2a30;border:1px solid #3a3a42;color:#fff;border-radius:10px;
    padding:10px 12px;font-size:16px;width:58%;}
  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper button{width:40px;height:40px;border-radius:10px;border:none;background:#33333b;color:#fff;font-size:22px;font-weight:800;}
  .stepper .val{min-width:54px;text-align:center;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;}
  .sheet .closebtn{width:100%;margin-top:18px;border:none;border-radius:14px;background:#fff;color:#111;
    font-weight:800;padding:16px;font-size:17px;}
  .ghost{background:#2a2a30;color:#fff;border:1px solid #3a3a42;border-radius:12px;padding:12px;font-weight:700;font-size:15px;width:100%;margin-top:8px;}
  .ghost.danger{color:#ff9a9a;border-color:#5a2a2a;}
  .teamline{display:flex;gap:8px;align-items:center;}
  .swatch{width:18px;height:18px;border-radius:5px;flex:none;}
  .muted{opacity:.6;font-size:13px;line-height:1.4;}
  .statgrid{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;font-size:14px;margin-top:6px;}
  .statgrid .h{opacity:.55;font-size:11px;text-transform:uppercase;letter-spacing:1px;}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;}
</style>
</head>
<body class="team1">
<div id="app">

  <!-- Scoreboard -->
  <div class="score">
    <div class="card" id="card0">
      <div class="name" id="name0">Team 1</div>
      <div class="pts" id="pts0">0</div>
      <div class="turn">singing</div>
    </div>
    <div class="card" id="card1">
      <div class="name" id="name1">Team 2</div>
      <div class="pts" id="pts1">0</div>
      <div class="turn">singing</div>
    </div>
  </div>

  <div class="topbar">
    <div class="label">Sing That Song</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="giveup" id="giveUpBtn" aria-label="Give up this word">give up</button>
      <button class="iconbtn" id="settingsBtn" aria-label="Settings">⚙</button>
    </div>
  </div>

  <!-- Stage -->
  <div class="stage">
    <div class="turnlabel" id="turnLabel">Team 1 — sing a song with…</div>
    <div class="word" id="word">ready?</div>
    <div class="passes" id="passes"></div>

    <div class="timerwrap">
      <div class="timer" id="timer">0:30</div>
      <div class="bar"><i id="bar"></i></div>
      <div class="statusmsg" id="statusMsg"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls" id="controls">
    <!-- READY -->
    <div id="stateReady">
      <div class="row">
        <button class="btn go big" id="startBtn">▶ Start Timer</button>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="shuffleBtn">🔀 New Word</button>
      </div>
    </div>

    <!-- RUNNING / PAUSED -->
    <div id="statePlay" class="hide">
      <div class="row">
        <button class="btn ok big" id="gotBtn">✓ Got It! (pass)</button>
      </div>
      <div class="row">
        <button class="btn" id="pauseBtn">⏸ Pause</button>
        <button class="btn warn" id="plus5Btn">+5s</button>
        <button class="btn" id="resetBtn">↺ Reset</button>
      </div>
    </div>

    <!-- TIME UP -->
    <div id="stateTimeup" class="hide">
      <div class="row">
        <button class="btn warn big" id="give4Btn">+4s grace</button>
      </div>
      <div class="row">
        <button class="btn bad" id="awardBtn">Point → other team</button>
        <button class="btn" id="resetBtn2">↺ Reset</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ SETTINGS SHEET ============ -->
<div class="modal hide" id="settingsModal">
  <div class="sheet">
    <h2>Settings</h2>

    <h3>Timing</h3>
    <div class="field">
      <label>Turn length (seconds)</label>
      <div class="stepper"><button data-step="turn,-5">−</button><span class="val" id="vTurn">30</span><button data-step="turn,5">+</button></div>
    </div>
    <div class="field">
      <label>Bump “+” amount</label>
      <div class="stepper"><button data-step="bump,-1">−</button><span class="val" id="vBump">5</span><button data-step="bump,1">+</button></div>
    </div>
    <div class="field">
      <label>Grace amount</label>
      <div class="stepper"><button data-step="grace,-1">−</button><span class="val" id="vGrace">4</span><button data-step="grace,1">+</button></div>
    </div>
    <div class="field">
      <label>Buzzer sound</label>
      <div class="stepper"><button id="soundToggle" class="ghost" style="width:auto;margin:0;padding:8px 16px">On</button></div>
    </div>

    <h3>Teams</h3>
    <div class="field">
      <div class="teamline"><span class="swatch" style="background:var(--t1)"></span><label>Team 1 name</label></div>
      <input type="text" id="tname0" maxlength="16" />
    </div>
    <div class="field">
      <div class="teamline"><span class="swatch" style="background:var(--t2)"></span><label>Team 2 name</label></div>
      <input type="text" id="tname1" maxlength="16" />
    </div>

    <h3>Manual correction</h3>
    <div class="field">
      <label id="scoreLbl0">Team 1 score</label>
      <div class="stepper"><button data-score="0,-1">−</button><span class="val" id="vScore0">0</span><button data-score="0,1">+</button></div>
    </div>
    <div class="field">
      <label id="scoreLbl1">Team 2 score</label>
      <div class="stepper"><button data-score="1,-1">−</button><span class="val" id="vScore1">0</span><button data-score="1,1">+</button></div>
    </div>
    <button class="ghost" id="swapTeamBtn">⇄ Switch which team is singing</button>

    <h3>Game</h3>
    <button class="ghost" id="newGameBtn">🆕 New game (reset scores, new log run)</button>

    <h3>Word back-and-forth log</h3>
    <div class="muted" id="logSummary">No data yet.</div>
    <div id="logStats"></div>
    <button class="ghost" id="exportJsonBtn">⬇ Export log (JSON)</button>
    <button class="ghost" id="exportCsvBtn">⬇ Export log (CSV)</button>
    <button class="ghost danger" id="clearLogBtn">🗑 Clear all logs</button>

    <button class="closebtn" id="closeSettings">Done</button>
  </div>
</div>

<script src="words.js"></script>
<script>
(function(){
  "use strict";

  // ---------- persistence ----------
  const LS = {
    get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };

  const DEFAULT_SETTINGS = {
    turn:30, bump:5, grace:4, sound:true,
    names:["Team 1","Team 2"]
  };
  let settings = Object.assign({}, DEFAULT_SETTINGS, LS.get("sts_settings",{}));
  if(!Array.isArray(settings.names)||settings.names.length<2) settings.names=["Team 1","Team 2"];

  // game state persists so a refresh doesn't wipe a game in progress
  const DEFAULT_GAME = { scores:[0,0], currentTeam:0, startingTeam:0, runId:newRunId() };
  let game = Object.assign({}, DEFAULT_GAME, LS.get("sts_game",{}));

  let logs = LS.get("sts_logs", []);   // [{runId, word, passes, winner, loser, startedBy, ts}]

  function saveSettings(){ LS.set("sts_settings", settings); }
  function saveGame(){ LS.set("sts_game", game); }
  function saveLogs(){ LS.set("sts_logs", logs); }
  function newRunId(){ return "run-" + Math.floor(performance.now()) + "-" + (LS.get("sts_runseq",0)+1); }

  // ---------- word deck ----------
  const ALL = (window.WORDS||["love","fire","night"]).slice();
  let deck = [];
  function reshuffle(){
    deck = ALL.slice();
    for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  }
  reshuffle();
  function nextWord(){ if(!deck.length) reshuffle(); return deck.pop(); }

  // ---------- round state ----------
  let state = "ready";          // ready | running | paused | timeup
  let currentWord = nextWord();
  let passes = 0;               // back-and-forth count for current word
  let remaining = settings.turn * 1000;
  let lastTick = 0;
  let raf = null;

  // ---------- elements ----------
  const $ = (id)=>document.getElementById(id);
  const body = document.body;
  const el = {
    word:$("word"), timer:$("timer"), bar:$("bar"), passes:$("passes"),
    turnLabel:$("turnLabel"), statusMsg:$("statusMsg"),
    card:[ $("card0"), $("card1") ], name:[ $("name0"), $("name1") ], pts:[ $("pts0"), $("pts1") ],
    ready:$("stateReady"), play:$("statePlay"), timeup:$("stateTimeup"),
    pauseBtn:$("pauseBtn"),
  };

  // ---------- rendering ----------
  function fmt(ms){
    const s = Math.max(0, Math.ceil(ms/1000));
    const m = Math.floor(s/60);
    return m+":"+String(s%60).padStart(2,"0");
  }
  function render(){
    // teams / scores
    el.name[0].textContent = settings.names[0];
    el.name[1].textContent = settings.names[1];
    el.pts[0].textContent = game.scores[0];
    el.pts[1].textContent = game.scores[1];
    el.card[0].classList.toggle("active", game.currentTeam===0);
    el.card[1].classList.toggle("active", game.currentTeam===1);

    body.classList.toggle("team1", game.currentTeam===0);
    body.classList.toggle("team2", game.currentTeam===1);

    el.word.textContent = currentWord;
    el.turnLabel.textContent = settings.names[game.currentTeam] + " — sing a song with…";
    el.passes.textContent = passes>0 ? ("Back-and-forth: " ) : "";
    if(passes>0){ el.passes.innerHTML = "Back-and-forth: <b>"+passes+"</b>"; }

    // timer
    el.timer.textContent = fmt(remaining);
    const total = settings.turn*1000;
    const pct = Math.max(0, Math.min(100, (remaining/total)*100));
    el.bar.style.width = pct+"%";
    el.timer.classList.toggle("low", remaining<=10000 && remaining>5000 && state!=="timeup");
    el.timer.classList.toggle("crit", remaining<=5000 && state!=="ready" && state!=="timeup");

    // status + controls
    el.ready.classList.toggle("hide", state!=="ready");
    el.play.classList.toggle("hide", !(state==="running"||state==="paused"));
    el.timeup.classList.toggle("hide", state!=="timeup");
    el.pauseBtn.textContent = state==="paused" ? "▶ Resume" : "⏸ Pause";

    el.statusMsg.className = "statusmsg";
    if(state==="ready") el.statusMsg.textContent = "Read the word, then press Start";
    else if(state==="paused") el.statusMsg.textContent = "Paused";
    else if(state==="timeup"){ el.statusMsg.textContent = "⏰ TIME'S UP!"; el.statusMsg.classList.add("bad"); }
    else el.statusMsg.textContent = "";
  }

  // ---------- timer loop ----------
  function loop(now){
    if(state!=="running"){ raf=null; return; }
    const dt = now - lastTick; lastTick = now;
    remaining -= dt;
    if(remaining<=0){ remaining=0; timeUp(); render(); return; }
    render();
    raf = requestAnimationFrame(loop);
  }
  function startLoop(){
    if(raf) cancelAnimationFrame(raf);
    lastTick = performance.now();
    raf = requestAnimationFrame(loop);
  }

  // ---------- transitions ----------
  function startTimer(){
    if(state!=="ready") return;
    state="running"; startLoop(); render();
  }
  function togglePause(){
    if(state==="running"){ state="paused"; if(raf) cancelAnimationFrame(raf); raf=null; }
    else if(state==="paused"){ state="running"; startLoop(); }
    render();
  }
  function bump(){ // +N seconds, capped at turn length
    remaining = Math.min(settings.turn*1000, remaining + settings.bump*1000);
    render();
  }
  function grace(){ // give grace seconds and resume from timeup
    remaining = settings.grace*1000;
    state="running"; body.classList.remove("timeup"); startLoop(); render();
  }
  function resetTimer(){ // same team, same word, back to ready with full time
    if(raf) cancelAnimationFrame(raf); raf=null;
    state="ready"; remaining=settings.turn*1000; body.classList.remove("timeup"); render();
  }

  // success: current team sang it -> count a pass, hand to the other team, same word.
  // The next team already knows the word, so start their timer immediately.
  function gotIt(){
    if(state!=="running" && state!=="paused") return;
    if(raf) cancelAnimationFrame(raf); raf=null;
    passes++;
    game.currentTeam = 1 - game.currentTeam;
    remaining=settings.turn*1000;
    state="running"; startLoop();
    saveGame(); render();
  }

  // current team failed -> other team scores; log the word; new word; winner starts
  function timeUp(){
    if(raf) cancelAnimationFrame(raf); raf=null;
    state="timeup";
    body.classList.add("timeup");
    setTimeout(()=>body.classList.remove("timeup"), 1600);
    buzzer();
  }
  function awardPoint(){
    const loser = game.currentTeam;
    const winner = 1 - loser;
    game.scores[winner]++;
    logResult(currentWord, passes, winner, loser);
    // winner starts the next word
    game.startingTeam = winner;
    game.currentTeam = winner;
    currentWord = nextWord();
    passes = 0;
    resetTimer();
    saveGame();
  }

  function logResult(word, passes, winner, loser){
    logs.push({
      runId: game.runId,
      word: word,
      passes: passes,
      winner: settings.names[winner],
      loser: settings.names[loser],
      startedBy: settings.names[game.startingTeam],
      ts: new Date().toISOString()
    });
    saveLogs();
    LS.set("sts_runseq", (LS.get("sts_runseq",0)+1));
  }

  function shuffleWord(){
    // only allowed before any pass on the current word
    if(passes>0) return;
    currentWord = nextWord(); render();
  }

  // ---------- buzzer (WebAudio, no asset) ----------
  let actx=null;
  function buzzer(){
    if(!settings.sound) return;
    try{
      actx = actx || new (window.AudioContext||window.webkitAudioContext)();
      const t=actx.currentTime;
      [0,0.18,0.36].forEach((off)=>{
        const o=actx.createOscillator(), g=actx.createGain();
        o.type="square"; o.frequency.value=180;
        o.connect(g); g.connect(actx.destination);
        g.gain.setValueAtTime(0.0001,t+off);
        g.gain.exponentialRampToValueAtTime(0.25,t+off+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t+off+0.15);
        o.start(t+off); o.stop(t+off+0.16);
      });
    }catch(e){}
  }

  // ---------- new game ----------
  function newGame(){
    game = { scores:[0,0], currentTeam: game.startingTeam||0, startingTeam: game.startingTeam||0, runId:newRunId() };
    currentWord = nextWord(); passes=0; reshuffle();
    resetTimer(); saveGame();
  }

  // ====================================================================
  // SETTINGS UI
  // ====================================================================
  const M = $("settingsModal");
  function openSettings(){ syncSettingsUI(); M.classList.remove("hide"); }
  function closeSettings(){ M.classList.add("hide"); render(); }

  function syncSettingsUI(){
    $("vTurn").textContent=settings.turn;
    $("vBump").textContent=settings.bump;
    $("vGrace").textContent=settings.grace;
    $("soundToggle").textContent=settings.sound?"On":"Off";
    $("tname0").value=settings.names[0];
    $("tname1").value=settings.names[1];
    $("vScore0").textContent=game.scores[0];
    $("vScore1").textContent=game.scores[1];
    $("scoreLbl0").textContent=settings.names[0]+" score";
    $("scoreLbl1").textContent=settings.names[1]+" score";
    renderLogStats();
  }

  function renderLogStats(){
    if(!logs.length){ $("logSummary").textContent="No data yet. Finished words will appear here."; $("logStats").innerHTML=""; return; }
    const dist={}; let keepable=0, tooShort=0, tooLong=0;
    logs.forEach(l=>{
      dist[l.passes]=(dist[l.passes]||0)+1;
      if(l.passes<=1) tooShort++;
      else if(l.passes>=8) tooLong++;
      else keepable++;
    });
    $("logSummary").innerHTML =
      "<b>"+logs.length+"</b> words logged across "+
      new Set(logs.map(l=>l.runId)).size+" run(s).<br>"+
      "<span class='pill' style='background:#16341f;color:#9be7b4'>good 2–7: "+keepable+"</span> "+
      "<span class='pill' style='background:#3a2a00;color:#ffd98a'>drop ≤1: "+tooShort+"</span> "+
      "<span class='pill' style='background:#3a1414;color:#ff9a9a'>drop ≥8: "+tooLong+"</span>";
    let rows="<div class='statgrid'><div class='h'>passes</div><div class='h'>words</div><div class='h'></div>";
    Object.keys(dist).map(Number).sort((a,b)=>a-b).forEach(k=>{
      rows+="<div>"+k+"</div><div>"+dist[k]+"</div><div></div>";
    });
    rows+="</div>";
    $("logStats").innerHTML=rows;
  }

  function download(name, text, type){
    const blob=new Blob([text],{type:type});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },300);
  }
  function exportJson(){ download("singthatsong-log.json", JSON.stringify(logs,null,2), "application/json"); }
  function exportCsv(){
    const head="word,passes,winner,loser,startedBy,runId,timestamp\n";
    const esc=(s)=>'"'+String(s).replace(/"/g,'""')+'"';
    const body=logs.map(l=>[l.word,l.passes,l.winner,l.loser,l.startedBy,l.runId,l.ts].map(esc).join(",")).join("\n");
    download("singthatsong-log.csv", head+body, "text/csv");
  }

  // ====================================================================
  // EVENTS
  // ====================================================================
  $("startBtn").onclick=startTimer;
  $("shuffleBtn").onclick=shuffleWord;
  $("gotBtn").onclick=gotIt;
  $("pauseBtn").onclick=togglePause;
  $("plus5Btn").onclick=bump;
  $("resetBtn").onclick=resetTimer;
  $("give4Btn").onclick=grace;
  $("awardBtn").onclick=awardPoint;
  $("resetBtn2").onclick=resetTimer;

  // give up: current team concedes this word, the other team scores
  function giveUp(){
    const other = settings.names[1 - game.currentTeam];
    if(state==="timeup"){ awardPoint(); return; }
    if(confirm("Give up on “"+currentWord+"”?\n"+other+" gets the point.")){
      awardPoint();
    }
  }
  $("giveUpBtn").onclick=giveUp;

  $("settingsBtn").onclick=openSettings;
  $("closeSettings").onclick=closeSettings;
  M.onclick=(e)=>{ if(e.target===M) closeSettings(); };

  // steppers (timing)
  document.querySelectorAll("[data-step]").forEach(b=>{
    b.onclick=()=>{
      const [k,d]=b.dataset.step.split(","); const delta=parseInt(d,10);
      if(k==="turn") settings.turn=Math.max(5, Math.min(180, settings.turn+delta));
      if(k==="bump") settings.bump=Math.max(1, Math.min(30, settings.bump+delta));
      if(k==="grace") settings.grace=Math.max(1, Math.min(30, settings.grace+delta));
      if(k==="turn" && state==="ready"){ remaining=settings.turn*1000; }
      saveSettings(); syncSettingsUI(); render();
    };
  });
  // score correction
  document.querySelectorAll("[data-score]").forEach(b=>{
    b.onclick=()=>{
      const [t,d]=b.dataset.score.split(","); const i=parseInt(t,10), delta=parseInt(d,10);
      game.scores[i]=Math.max(0, game.scores[i]+delta);
      saveGame(); syncSettingsUI(); render();
    };
  });
  $("soundToggle").onclick=()=>{ settings.sound=!settings.sound; saveSettings(); syncSettingsUI(); };
  $("tname0").oninput=(e)=>{ settings.names[0]=e.target.value||"Team 1"; saveSettings(); syncSettingsUI(); render(); };
  $("tname1").oninput=(e)=>{ settings.names[1]=e.target.value||"Team 2"; saveSettings(); syncSettingsUI(); render(); };
  $("swapTeamBtn").onclick=()=>{ game.currentTeam=1-game.currentTeam; saveGame(); syncSettingsUI(); render(); };
  $("newGameBtn").onclick=()=>{ if(confirm("Start a new game? Scores reset and a new log run begins.")){ newGame(); closeSettings(); } };

  $("exportJsonBtn").onclick=exportJson;
  $("exportCsvBtn").onclick=exportCsv;
  $("clearLogBtn").onclick=()=>{ if(confirm("Delete ALL logged word data? This cannot be undone.")){ logs=[]; saveLogs(); renderLogStats(); } };

  // keep awake-ish: prevent accidental scroll
  document.addEventListener("touchmove", (e)=>{ if(e.target.closest(".sheet")) return; e.preventDefault(); }, {passive:false});

  render();
})();
</script>
</body>
</html>
